<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cavybot 대시보드</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🐹 cavybot 대시보드</div>
    <div class="actions">
      <span class="hint"><b>드래그</b>로 이동 · 카드/메뉴에 마우스 올리면 <b>＋추가 ✎수정 ⧉복사 🗑삭제</b></span>
      <button id="resetBtn" class="btn ghost" title="기본 배치로 되돌리기">↺ 초기화</button>
    </div>
  </header>

  <main id="board" class="board" aria-label="대시보드 보드"></main>

  <!-- MCP 추천 모달 -->
  <div id="mcpModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="mcpTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="mcpTitle">🔌 MCP & 무료 자동화 도구 추천</h2>
        <button id="mcpClose" class="btn ghost" aria-label="닫기">✕</button>
      </div>
      <div id="mcpDaily" class="daily"></div>
      <div id="mcpBody" class="mcp-body"></div>
      <p class="foot">매일 <b>오늘의 추천</b>이 자동 갱신됩니다 · 영상·디자인·명함·배너·크롤링·자동화 무료 도구 모음</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
