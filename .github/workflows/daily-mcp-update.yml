name: Daily MCP/도구 추천 갱신

# 매일 '오늘의 추천'(dashboard/data/daily.json)을 자동 갱신합니다.
# 예약 실행은 저장소 기본 브랜치(main)의 워크플로 기준으로 동작합니다.
on:
  schedule:
    - cron: "5 21 * * *"   # 매일 UTC 21:05 = KST 06:05
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate today's picks
        run: node scripts/update-daily.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain dashboard/data/daily.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dashboard/data/daily.json
            git commit -m "chore: 오늘의 MCP/도구 추천 자동 갱신"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
